<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
:root {
  --sea: #1d3557;
  --sea-ink: #f4f7fb;
  --sea-soft: rgba(244, 247, 251, 0.62);
  --sun: #f4bf4f;
  --paper: #fbfcfd;
  --ink: #18233a;
  --ink-soft: #46536a;
  --life: #2a5ea8;
  --band: #e4f1ef;
  --group: #17696a;
  --hand: "LXGW WenKai", "Noto Serif CJK SC", "Noto Color Emoji", serif;
  --sans: "Noto Sans CJK SC", "Noto Color Emoji", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--paper); }
body {
  width: 640px;
  color: var(--ink);
  font-family: var(--hand);
  -webkit-font-smoothing: antialiased;
  line-break: strict;
  text-wrap: pretty;
}

/* 头部一整块海蓝：名字、出发到今天的成长尺 */
header { padding: 30px 28px 22px; background: var(--sea); color: var(--sea-ink); }
h1 { font-weight: 500; font-size: 40px; line-height: 1.15; overflow-wrap: anywhere; }
.since { margin-top: 6px; font-family: var(--sans); font-size: 14px; color: var(--sea-soft); }

/*
 * 成长尺：出发点到今天，一个月一格。每天整理真改了东西就在尺上方记一道印，
 * 人生线长一点、本群短一点，日子久了尺上会越来越密。
 */
.ruler { position: relative; margin-top: 20px; height: 52px; }
.ruler .marks { position: absolute; left: 0; right: 0; top: 0; height: 20px; }
.ruler .mark { position: absolute; bottom: 0; width: 1.5px; margin-left: -0.75px; background: var(--sea-ink); }
.ruler .mark.life { height: 18px; opacity: 0.9; }
.ruler .mark.group { height: 9px; opacity: 0.5; }
.ruler .line { position: absolute; left: 0; right: 0; top: 22px; height: 2px; background: var(--sea-ink); }
.ruler .tick { position: absolute; top: 22px; width: 1px; height: 6px; background: var(--sea-ink); }
.ruler .tick.year { width: 2px; height: 11px; margin-left: -0.5px; }
.ruler .label {
  position: absolute;
  top: 35px;
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--sea-soft);
  white-space: nowrap;
  transform: translateX(-50%);
}
.ruler .label.start { transform: none; }
.ruler .now {
  position: absolute;
  top: 17px;
  width: 12px;
  height: 12px;
  margin-left: -6px;
  border-radius: 50%;
  background: var(--sun);
  box-shadow: 0 0 0 3px var(--sea);
}
.ruler .label.now-label { left: auto; right: 0; transform: none; color: var(--sun); font-weight: 700; }

/* 段名放在段首，彩色粗体，正文占满整行 */
.part { padding: 20px 28px 22px; }
.lead { font-size: 17.5px; line-height: 1.7; }
.para { margin-top: 12px; font-size: 15.5px; line-height: 1.75; text-align: justify; }
.para b, .list-title {
  margin-right: 8px;
  font-family: var(--sans);
  font-weight: 700;
  font-size: 14px;
  color: var(--life);
}
.empty { color: var(--ink-soft); }

/* 群里的 ta：换一层青色的底，和人生线分开 */
.group { background: var(--band); }
.group .para b, .group .list-title { color: var(--group); }
.group-title { font-size: 24px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
.group-title small { margin-right: 6px; font-size: 16px; color: var(--group); }
.list-title { display: block; margin-top: 14px; }
.list { list-style: none; margin-top: 4px; }
.list li { font-size: 15.5px; line-height: 1.65; }
.list li + li { margin-top: 3px; }
.list time {
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 500;
  color: var(--group);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.styles time { margin-left: 8px; }
.dated li { display: grid; grid-template-columns: 40px 1fr; align-items: baseline; }

/* 最近的改动：一条一行，放不下就省略 */
.changes { padding: 16px 28px 22px; border-top: 3px solid var(--sea); }
.changes .list-title { margin-top: 0; color: var(--sea); }
.log { list-style: none; margin-top: 6px; }
.log li {
  display: grid;
  grid-template-columns: 40px 44px 1fr;
  align-items: baseline;
  font-size: 14.5px;
  line-height: 1.75;
  color: var(--ink-soft);
}
.log li span:last-child { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.log time, .log .scope { font-family: var(--sans); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.log .scope-life { color: var(--life); }
.log .scope-group { color: var(--group); }
</style>
</head>
<body>
  <header>
    <h1>{{name}}</h1>
    <p class="since">{{since}}</p>
    <div class="ruler">{{ruler}}</div>
  </header>
  <div class="part">{{life}}</div>
  <div class="part group">
    <p class="group-title"><small>在</small>{{group_name}}</p>
    {{group}}
  </div>
  {{changes}}
</body>
</html>
